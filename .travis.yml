sudo: false
arch:
 # ppc64le is no longer provisioned for this repo -- its jobs queue forever
 - amd64
language: node_js
node_js:
  # Node 24 is the runtime that packed the published tarball
  - "24"
  - "10"
  - "12"
  - "14"
before_install:
  # the committed package-lock.json is lockfileVersion 3, which the npm bundled
  # with Node 10/12/14 cannot install from
  - rm -f package-lock.json
script:
  # "npm test" is `tape test/*.js`, which picks up test/redos.js -- an ES module
  # using the built-in node:test runner (Node >= 18 only). Modern legs run the
  # full npm test; legacy legs hand tape every other test file so they still
  # execute the whole CommonJS suite, including tests added after this was written.
  - |
    if [ "$(node -p 'process.versions.node.split(".")[0]')" -ge 18 ]; then
      npm test
    else
      node node_modules/.bin/tape $(ls test/*.js | grep -v '^test/redos\.js$')
    fi
