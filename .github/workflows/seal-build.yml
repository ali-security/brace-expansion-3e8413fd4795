name: seal-build

on:
  workflow_dispatch: {}

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # the published tarball was packed with npm 11.13.0
      - name: install npm
        run: npm install -g npm@11.13.0
      - name: pack
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: brace-expansion-*.tgz
          if-no-files-found: error
